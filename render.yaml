services:
  - type: web
    name: rankpilot
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.sqlite
      - key: SCOPES
        value: read_products,write_products,read_inventory,write_inventory,read_themes,write_themes
      - key: INDEXNOW_KEY
        value: rankpilot_indexnow_demo_key
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
